name: Update furniture English names

on:
  schedule:
    - cron: '37 19 * * 2' # Wednesday 04:37 JST, once per week
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furniture-english-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/furniture-english
          key: furniture-english-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: furniture-english-v1-
      - name: Test matching and safe fetching
        run: python -m unittest test_furniture_english.py
      - name: Fetch English names (serial, 15 seconds between requests)
        run: python update_furniture_english.py
      - name: Commit only changed name data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- furniture_english.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update furniture English names"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
